name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          # Pinned rather than derived from the github.repository context: this
          # workflow is also dispatched from the private repo, where that context
          # resolves to the private name and publishes an image nothing consumes,
          # burning billed minutes.
          images: ghcr.io/mtclab/homepilot-core-public
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=HomePilot
            org.opencontainers.image.description=AI-first, artifact-backed homelab platform
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Stamp the agent binary baked INTO the image. The Dockerfile has
          # always read this arg and its comment has always claimed "the release
          # passes --build-arg HP_VERSION=<tag>" - and this step never did, so
          # every published image shipped an agent that reports itself as `dev`.
          # The sibling build-agent job below stamps the RELEASE ASSET binaries
          # correctly, which is why the gap was invisible: the versioned binary
          # is the one nobody installs, and the `dev` one is what enrolment
          # actually hands to a guest. Found by driving 3.6.21 (#648).
          build-args: |
            HP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed  # v5.1.0
        with:
          go-version: "1.23"

      - name: Build hp-agent
        working-directory: agent/go
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
          -o ../../dist/hp-agent-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hp-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/hp-agent-${{ matrix.goos }}-${{ matrix.goarch }}

  github-release:
    needs: [docker, build-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Download agent binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: hp-agent-*
          merge-multiple: true

      # The installer (scripts/install-agent.sh) REFUSES an unverified GitHub
      # fallback download: it fetches this manifest and checks the binary against
      # it, and aborts naming SHA256SUMS when the asset is absent. So the manifest
      # is a release requirement, not a nicety.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum hp-agent-* > SHA256SUMS

      # PROVENANCE names the private commit this mirror export was cut from. It is
      # attached when present; guarded so a release cut before the next re-export
      # still succeeds.
      - name: Stage PROVENANCE if present
        run: |
          set -euo pipefail
          if [ -f PROVENANCE ]; then
            cp PROVENANCE dist/PROVENANCE
            echo "PROVENANCE attached:"; cat PROVENANCE
          else
            echo "No PROVENANCE in this tree - skipping (pre-provenance export)."
          fi

      # The release body starts with this version's docs/CHANGELOG.md section
      # (heading "## <version> - <date>"). HomePilot's update notice reads the
      # release body, including its "Operator actions" subsection, so a body
      # without the changelog showed "update available" with nothing to do.
      # A missing section warns and still releases: the image is already pushed.
      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " && found { exit }
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found { print }
          ' docs/CHANGELOG.md > dist/CHANGES.md
          if [ ! -s dist/CHANGES.md ]; then
            echo "::warning::No '## $VERSION' section in docs/CHANGELOG.md - release notes carry no changelog text."
            echo "See docs/CHANGELOG.md." > dist/CHANGES.md
          fi
          {
            cat dist/CHANGES.md
            printf '\n## Docker\n\n```bash\ndocker pull ghcr.io/mtclab/homepilot-core-public:%s\n```\n\n' "$TAG"
            printf 'Or with docker compose - set `HP_IMAGE_TAG=%s` in your `.env`.\n\n' "$TAG"
            printf '## Agent Binary\n\nDownload the `hp-agent` binary for your managed hosts:\n\n```bash\n# Linux amd64\n'
            printf 'curl -LO https://github.com/mtclab/homepilot-core-public/releases/download/%s/hp-agent-linux-amd64\n' "$TAG"
            printf 'chmod +x hp-agent-linux-amd64\nsudo mv hp-agent-linux-amd64 /usr/local/bin/hp-agent\n\n# Or use the install script\n'
            printf 'curl -fsSL https://raw.githubusercontent.com/mtclab/homepilot-core-public/main/scripts/install-agent.sh | bash\n```\n'
          } > dist/RELEASE_NOTES.md
          rm dist/CHANGES.md
          echo "Release notes: $(wc -l < dist/RELEASE_NOTES.md) lines"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/hp-agent-*
            dist/SHA256SUMS
            dist/PROVENANCE
            scripts/install-agent.sh
          body_path: dist/RELEASE_NOTES.md