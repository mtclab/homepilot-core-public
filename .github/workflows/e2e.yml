name: E2E Tests

on:
  # Heavy (installs chromium) — run only on release PRs to main + on demand,
  # to conserve private-repo Actions minutes during dev. See issue #295.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: pip install -e ".[dev]" && pip install playwright pytest-playwright && playwright install chromium

      - name: Build web UI
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Start HomePilot server
        run: |
          HP_SECRET_KEY=ci-test-secret HP_VAULT_PASSPHRASE=ci-test-pass \
          HP_ADMIN_SECRET="${{ secrets.HP_VAULT_PASSPHRASE || 'ci-test-pass' }}" \
            uvicorn homepilot.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for healthy server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Server is healthy"
              exit 0
            fi
            echo "Waiting for server... attempt $i"
            sleep 2
          done
          echo "Server did not become healthy in time"
          exit 1

      - name: Create test token
        id: create-token
        run: |
          ADMIN_SECRET="${{ secrets.HP_VAULT_PASSPHRASE || 'ci-test-pass' }}"
          RESP=$(curl -s -X POST http://localhost:8000/auth/tokens \
            -H "Content-Type: application/json" \
            -H "x-hp-admin-secret: $ADMIN_SECRET" \
            -d '{"label": "e2e-ci", "scope": "full"}')
          echo "Token response: $RESP"
          TOKEN=$(echo "$RESP" | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])" 2>/dev/null || echo "")
          if [ -z "$TOKEN" ]; then
            echo "Failed to create test token"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests
        run: pytest tests/test_e2e.py -v
        env:
          HP_TEST_URL: http://localhost:8000
          HP_TEST_TOKEN: ${{ steps.create-token.outputs.token }}
          HP_TEST_ADMIN_SECRET: ${{ secrets.HP_VAULT_PASSPHRASE || 'ci-test-pass' }}

      - name: Stop server
        if: always()
        run: |
          kill $(lsof -t -i:8000) 2>/dev/null || true