name: Integration Tests

on:
  # Security audits — run only on release PRs to master + on demand, to conserve
  # private-repo Actions minutes during dev. See issue #295.
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", ".gitignore"]
  pull_request:
    branches: [master]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", ".gitignore"]
  workflow_dispatch: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,security]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy src/

      - name: Security audit - pip-audit
        run: pip-audit --desc

      - name: Security audit - bandit
        # Baseline accepts the pre-existing findings (mostly intentional
        # subprocess/SQL/assert patterns in this infra tool) and fails only on
        # NEW issues. See issue #295 for per-finding triage.
        run: bandit -r src/homepilot/ -b .bandit_baseline.json -f json -o bandit-report.json

      - name: Security audit - detect-secrets
        run: |
          detect-secrets scan --all-files --force-use-all-plugins src/ > secrets-report.json || true
          FINDINGS=$(python -c "import json; print(len(json.load(open('secrets-report.json'))['results']))" 2>/dev/null || echo "0")
          if [ "$FINDINGS" -gt 0 ]; then
            echo "::error::detect-secrets found $FINDINGS potential secrets"
            cat secrets-report.json
            exit 1
          fi
      # NOTE: pytest runs in the `test` job (ci.yml) — not duplicated here.
