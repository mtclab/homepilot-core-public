# The bundled ntfy server's vhost (#822) - a REFERENCE the operator adapts.
#
# HomePilot cannot make a DNS name or a public proxy appear. If a phone should
# get alerts away from your LAN/VPN, put a vhost like this in front of the opt-in
# `ntfy` compose service, then give its address in Monitoring > Channels ("The
# address your phone will use"): HomePilot checks it answers before calling the
# setup done.
#
# The operator ADAPTS: server_name, the certificate paths and
# <control-plane-address>:<port> (HP_NTFY_BIND:HP_NTFY_PORT in the compose .env;
# the default 127.0.0.1:2586 only works when nginx runs on the same host). Do NOT
# adapt: the blocked admin paths, the websocket headers, buffering off and the
# timeouts - tests/test_ntfy_vhost_reference.py lints this file for them.
#
# The phone's certificate check is the ntfy app's: use a certificate the phone
# trusts (a public CA, or your own CA installed on the phone). There is no client
# certificate here - the ntfy app cannot present one; ntfy's own login (a phone
# login from "Add a phone", read-only on HomePilot's topic) is the gate, and
# anonymous access is deny-all.
#
# NOT YET PROVEN LIVE: walked on a dev box with a real phone before this counts
# as field-tested (see the PR's live-walk list).

server {
    listen 80;
    server_name ntfy.example.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ntfy.example.net;

    ssl_certificate         /etc/nginx/certs/ntfy.crt;
    ssl_certificate_key     /etc/nginx/certs/ntfy.key;

    # ntfy's admin API (phone logins, tiers, the version an admin may read) is
    # HomePilot's alone, over the compose network. Never from outside, even
    # though it needs the admin token anyway.
    location ~ ^/v1/(users|tiers|version|stats)(/|$) { return 404; }
    location = /metrics { return 404; }

    location / {
        proxy_pass http://<control-plane-address>:2586;
        proxy_http_version 1.1;

        # Subscriptions are long-lived streams (JSON stream, SSE) or websockets:
        # nothing may be buffered, and the upgrade headers must pass.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # ntfy runs with behind-proxy: true and rate-limits by this header's
        # right-most address - the one this proxy adds.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ntfy sends a keepalive every 45 s (keepalive-interval) on an idle
        # subscription. nginx's 60 s default leaves almost no margin; a read
        # timeout under 45 s cuts every quiet subscription.
        proxy_connect_timeout 3m;
        proxy_send_timeout 3m;
        proxy_read_timeout 3m;

        # Phones only read; attachments are off on the bundled server.
        client_max_body_size 64k;
    }
}
