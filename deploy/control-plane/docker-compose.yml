# HomePilot v2 — control-plane only (backend + agent-hub).
# Jumpserver is intentionally absent: the host agent (agent-hub) replaced it.
# Agent-stack services (llm, n8n, searxng, radicale, …) live in the
# homepilot-agent monitoring/matrix stack, not here.
#
# Layout on the deployment host:
#   /opt/homepilot/
#     docker-compose.yml   <- this file
#     .env                 <- from .env.example
#     repo/                <- homepilot-v2 source (Docker build context)
#
# Data (db + vault) lives in the named volume `hp-data`, which inherits the
# image's homepilot:homepilot (uid 999) ownership on first use — so there is no
# host-side chown step. If you prefer a host bind mount for easy backups, use
#   volumes: ["./data/hp:/home/homepilot/.hp"]
# and `chown -R 999:999 ./data/hp` before the first start (see docs/bugs-found.md
# Bug 8).
services:
  backend:
    container_name: homepilot
    image: ghcr.io/mtclab/homepilot-core-public:${HP_IMAGE_TAG:-3.14.1}
    build:
      context: ./repo
      dockerfile: Dockerfile
    ports:
      - "${HP_DAEMON_PORT:-8000}:8000"
      - "${HP_AGENT_HUB_PORT:-8443}:8443"
    volumes:
      - hp-data:/home/homepilot/.hp
    env_file:
      - path: .env
        required: false
    environment:
      # Where the opt-in ntfy service answers on the compose network (#822).
      HP_NTFY_INTERNAL_URL: ${HP_NTFY_INTERNAL_URL:-http://ntfy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Covers the shutdown's bounded worst case (~126 s, main.shutdown_worst_case_s);
    # Docker's default 10 s SIGKILLs a clean shutdown mid-drain (#812).
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - homepilot

  # ── Phone alerts: the bundled ntfy server (#822) - OPT-IN ────────────────
  # Runs only after `docker compose --profile ntfy up -d` (or with
  # COMPOSE_PROFILES=ntfy in .env). Enable it in Monitoring > Channels FIRST:
  # that creates the `ntfy/` directory inside hp-data, which this service mounts
  # as a volume subpath (Docker Engine >= 26) and which must exist when the
  # container is created. HomePilot then writes ntfy/server.yml and manages
  # phone logins over ntfy's admin API; the service waits for that file and
  # restarts or stops ntfy by itself when it changes. Same block as the root
  # docker-compose.yml - see the comments there.
  ntfy:
    image: binwiederhier/ntfy:v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
    profiles: ["ntfy"]
    container_name: homepilot-ntfy
    entrypoint: ["sh", "-c"]
    command:
      - |
        cfg="$${NTFY_HP_CONFIG:-/var/lib/ntfy/server.yml}"
        pid=""
        trap 'if [ -n "$$pid" ]; then kill -TERM "$$pid" 2>/dev/null; wait "$$pid"; fi; exit 0' TERM INT
        while :; do
          if [ ! -f "$$cfg" ]; then sleep 5; continue; fi
          sum="$$(sha256sum "$$cfg")"
          ntfy serve --config "$$cfg" &
          pid=$$!
          while kill -0 "$$pid" 2>/dev/null && [ "$$(sha256sum "$$cfg" 2>/dev/null)" = "$$sum" ]; do sleep 5; done
          kill -TERM "$$pid" 2>/dev/null
          wait "$$pid"
          pid=""
          sleep 1
        done
    ports:
      - "${HP_NTFY_BIND:-127.0.0.1}:${HP_NTFY_PORT:-2586}:80"
    volumes:
      - type: volume
        source: hp-data
        target: /var/lib/ntfy
        volume:
          subpath: ntfy
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - homepilot

networks:
  homepilot:
    driver: bridge

volumes:
  hp-data:
