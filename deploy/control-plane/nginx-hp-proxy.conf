# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE — set the proxy_pass upstreams below before deploying.
# Every upstream IP is a placeholder (10.0.0.1). Replace with your own hosts:
#   • "/" and "/health"  → your HomePilot backend host, port 8000
#   • /n8n/ /search/ /caldav/ /asr/ /zabbix/ → your agent-stack host(s)
# TLS certs are expected at /etc/nginx/ssl/hp-proxy.{crt,key}.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/hp-proxy.crt;
    ssl_certificate_key /etc/nginx/ssl/hp-proxy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # HP v2 backend (root path)
    location / {
        proxy_pass http://10.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check (explicit, same backend)
    location /health {
        proxy_pass http://10.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # n8n workflow engine
    location /n8n/ {
        proxy_pass http://10.0.0.1:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SearXNG meta-search
    location /search/ {
        proxy_pass http://10.0.0.1:8888/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Radicale CalDAV/CardDAV
    location /caldav/ {
        proxy_pass http://10.0.0.1:5232/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Whisper ASR
    location /asr/ {
        proxy_pass http://10.0.0.1:9099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Zabbix monitoring
    location /zabbix/ {
        proxy_pass http://10.0.0.1:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}