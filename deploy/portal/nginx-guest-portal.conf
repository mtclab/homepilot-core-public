# The guest portal vhost (#442) - THE REFERENCE, and the source of truth.
#
# This is the front nginx that friends' browsers hit. It is the FIRST of the two
# walls between a guest and the operator API (the second is the app itself: every
# management route requires a bearer token, gated by
# tests/test_portal_management_boundary.py). Only /guest/* and /invite/* may
# reach HomePilot from here - the backend serves the operator API and MCP on the
# very same port, so a location block that widens this prefix publishes the whole
# control plane to the internet.
#
# The operator ADAPTS: <backend-host>, server_name, and the certificate paths are
# per-deployment. Do NOT adapt the location match, the stripped Authorization /
# Cookie headers, or the three trust headers - those are the security contract,
# and tests/test_guest_vhost_reference.py lints this file for them.
#
# Backend env that must match (control-plane box): HP_PORTAL_TRUSTED_PROXY (this
# server's address as the backend sees it), HP_PORTAL_PROXY_SECRET,
# HP_PORTAL_VERIFY_HEADER=ssl-client-verify,
# HP_PORTAL_CN_HEADER=ssl-client-subject-dn. Unset = every guest route answers
# 503, fail-closed.
#
# NOT YET PROVEN LIVE: no guest portal is deployed. A real deployment is verified
# by a live smoke at go-live (mTLS handshake, /guest/ renders, /inventory from the
# public vhost 404s) - owner-gated, not yet run. Until then this file is a lint-
# checked reference, not a field-tested one.

server {
    listen 443 ssl;
    server_name guests.example.net;

    ssl_certificate         /etc/nginx/certs/guests.crt;
    ssl_certificate_key     /etc/nginx/certs/guests.key;

    # The friends' CA. `optional` so the page itself can render a clear
    # "no certificate" message instead of a browser-level TLS failure;
    # the backend refuses anything unverified regardless.
    ssl_client_certificate  /etc/nginx/certs/friends-ca.crt;
    ssl_verify_client       optional;

    location = / { return 302 /guest/; }

    # ONLY these two prefixes reach HomePilot. Everything else 404s here.
    location ~ ^/(guest|invite)(/|$) {
        proxy_pass http://<backend-host>:8000;
        proxy_set_header X-Hp-Portal-Secret     "<value of HP_PORTAL_PROXY_SECRET>";
        proxy_set_header ssl-client-verify      $ssl_client_verify;
        proxy_set_header ssl-client-subject-dn  $ssl_client_s_dn;
        # Never forward auth material a client might try to smuggle.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
}
