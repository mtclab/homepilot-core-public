services:
  # ═══════════════════════════════════════════════════════════════════════
  #  HomePilot v2 — data-dir ownership (runs once per `up`, then exits)
  # ═══════════════════════════════════════════════════════════════════════
  # The backend runs as the image's `homepilot` user, but Docker creates a
  # missing bind-mount source (./data/hp) as root:root - so on a fresh host the
  # backend could not create its database and crash-looped (`unable to open
  # database file`, docs/bugs-found.md Bug 8, #721). This one-shot step hands
  # the data dir to `homepilot` before the backend starts, touching only what
  # is not already owned by it, so the README's `docker compose up -d` needs no
  # chown on a fresh host and changes nothing on an existing one. It uses the
  # backend's own image, so the uid is the image's, never a guessed number.
  hp-data-init:
    image: ghcr.io/mtclab/homepilot-core-public:${HP_IMAGE_TAG:-3.14.0}
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    # The `ntfy/` subdirectory is the opt-in phone-alert server's (#822): made
    # here, before anything mounts it, so Docker never creates it root:root.
    entrypoint:
      - sh
      - -c
      - mkdir -p /home/homepilot/.hp/ntfy && find /home/homepilot/.hp \( ! -user homepilot -o ! -group homepilot \) -exec chown -h homepilot:homepilot {} +
    volumes:
      - ./data/hp:/home/homepilot/.hp
    network_mode: none
    restart: "no"

  # ═══════════════════════════════════════════════════════════════════════
  #  HomePilot v2 — core backend
  # ═══════════════════════════════════════════════════════════════════════
  backend:
    container_name: homepilot
    image: ghcr.io/mtclab/homepilot-core-public:${HP_IMAGE_TAG:-3.14.0}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HP_DAEMON_PORT:-8000}:8000"
      - "${HP_AGENT_HUB_PORT:-8443}:8443"
    volumes:
      - ./data/hp:/home/homepilot/.hp
    depends_on:
      hp-data-init:
        condition: service_completed_successfully
    # Optional (#721): a stock install needs no `.env` at all - the vault
    # passphrase, secret key and database generate themselves on first boot.
    # `.env.example` documents what can be set. (Compose >= 2.24.)
    env_file:
      - path: .env
        required: false
    environment:
      HP_AGENT_HUB_ENABLED: ${HP_AGENT_HUB_ENABLED:-true}
      HP_AGENT_HUB_PORT: "8443"
      HP_AGENT_HUB_AUTH_TOKEN: ${HP_AGENT_HUB_AUTH_TOKEN:-}
      # Where the opt-in ntfy service answers on the compose network (#822).
      HP_NTFY_INTERNAL_URL: ${HP_NTFY_INTERNAL_URL:-http://ntfy}
    restart: unless-stopped
    # A clean shutdown normally takes about a second, but each of its steps is
    # bounded and their sum is ~126 s (main.shutdown_worst_case_s: hub stop,
    # reconcilers, seven drains, pools, WAL checkpoint, close). Docker's default
    # 10 s would SIGKILL one that legitimately needs longer - a git push in
    # flight, a slow disk - mid-drain (#812). tests/test_compose_stop_grace.py.
    stop_grace_period: 150s
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - homepilot

  # ═══════════════════════════════════════════════════════════════════════
  #  Phone alerts: the bundled ntfy server (#822) - OPT-IN
  # ═══════════════════════════════════════════════════════════════════════
  # Nothing here runs unless you start the profile once:
  #     docker compose --profile ntfy up -d
  # (or put COMPOSE_PROFILES=ntfy in .env so a plain `up -d` includes it).
  # HomePilot provisions it from Monitoring > Channels > "Get alerts on your
  # phone": it writes ./data/hp/ntfy/server.yml (deny-all, its own tokens, no
  # signup, no attachments) and makes phone logins over ntfy's admin API. Until
  # that file exists the service waits; when it changes or disappears the
  # service restarts or stops ntfy by itself - no command after the first.
  #
  # Pinned by tag AND digest (the spike that verified this release:
  # docs/spikes/ntfy-bundle.md). Bound to one address of this host only:
  # 127.0.0.1 unless HP_NTFY_BIND names the control plane's LAN address, which
  # the reference vhost (deploy/ntfy/nginx-ntfy.conf) on another box needs.
  ntfy:
    image: binwiederhier/ntfy:v2.37.2@sha256:1875ddcf815c8a3c981d6d78c67a93452d0abba79b1ab9520b1f5f5238902bd7
    profiles: ["ntfy"]
    container_name: homepilot-ntfy
    entrypoint: ["sh", "-c"]
    command:
      - |
        cfg="$${NTFY_HP_CONFIG:-/var/lib/ntfy/server.yml}"
        pid=""
        trap 'if [ -n "$$pid" ]; then kill -TERM "$$pid" 2>/dev/null; wait "$$pid"; fi; exit 0' TERM INT
        while :; do
          if [ ! -f "$$cfg" ]; then sleep 5; continue; fi
          sum="$$(sha256sum "$$cfg")"
          ntfy serve --config "$$cfg" &
          pid=$$!
          while kill -0 "$$pid" 2>/dev/null && [ "$$(sha256sum "$$cfg" 2>/dev/null)" = "$$sum" ]; do sleep 5; done
          kill -TERM "$$pid" 2>/dev/null
          wait "$$pid"
          pid=""
          sleep 1
        done
    ports:
      - "${HP_NTFY_BIND:-127.0.0.1}:${HP_NTFY_PORT:-2586}:80"
    volumes:
      - ./data/hp/ntfy:/var/lib/ntfy
    depends_on:
      hp-data-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - homepilot

  # ═══════════════════════════════════════════════════════════════════════
  #  Agent services (from homepilot-agent repo — merged into v2)
  # ═══════════════════════════════════════════════════════════════════════

  # ── n8n (workflow automation) ────────────────────────────────────────────
  # The owner account is managed from the environment (#775). n8n 1.0 removed
  # basic auth, so a fresh instance with no owner hands the owner account - and
  # every credential stored in n8n - to the first visitor of its UI. With
  # N8N_INSTANCE_OWNER_MANAGED_BY_ENV n8n sets the owner from the two variables
  # below at EVERY start, and refuses to start while either is empty: the
  # instance is never up without an owner. Set them in .env (see .env.example).
  # No port is published. To reach the UI, publish it on loopback only
  # ("127.0.0.1:5678:5678") and use an SSH tunnel - never on 0.0.0.0.
  n8n:
    image: n8nio/n8n:2.35.3
    profiles: ["agents"]
    container_name: n8n
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-Etc/UTC}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_INSTANCE_OWNER_EMAIL:-}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_INSTANCE_OWNER_PASSWORD_HASH:-}
      HP_MCP_URL: http://backend:8000/mcp
      HP_MCP_TOKEN: ${HP_MCP_TOKEN:-}
      HP_MCP_TOKEN_RW: ${HP_MCP_TOKEN_RW:-}
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_ROOM_ID: ${MATRIX_ROOM_ID:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      # Deliberately NOT here (#787): N8N_BLOCK_ENV_ACCESS_IN_NODE stays at n8n
      # 2.x's default (blocked), because this environment holds HP_MCP_TOKEN_RW.
      # The shipped flows (n8n/*.json) read their secrets from n8n credentials
      # and their HomePilot URL / Matrix room / Telegram chat from their
      # "Notification Targets" node - n8n's own store, never this env.
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      searxng:
        condition: service_healthy
      radicale:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - homepilot

  # ── SearXNG (meta search) ──────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    profiles: ["agents"]
    container_name: searxng
    volumes:
      - ./agent/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - homepilot

  # ── Radicale (CalDAV/CardDAV) ───────────────────────────────────────────
  radicale:
    image: tomsquest/docker-radicale:3.7.6.0
    profiles: ["agents"]
    container_name: radicale
    volumes:
      - ./agent/radicale/config:/config/config:ro
      - ./agent/data/radicale:/data
      - ./agent/radicale/htpasswd:/data/htpasswd:ro
    environment:
      RADICALE_CONFIG: /config/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5232/.well-known/caldav/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - homepilot

  # ── Whisper (speech-to-text) ────────────────────────────────────────────
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    profiles: ["agents"]
    container_name: whisper
    environment:
      WHISPER__MODEL: base
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__DEVICE: cpu
    volumes:
      - ./agent/data/whisper:/root/.config/faster-whisper-server
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - homepilot

  # ── Piper (text-to-speech) ─────────────────────────────────────────────
  # wyoming-piper takes its settings as command-line flags only (#776): it
  # exits with "--voice is required for the piper backend" without one, and
  # reads no PIPER_* environment variables. The image's entrypoint already
  # passes --uri tcp://0.0.0.0:10200 --data-dir /data; these are appended.
  # Port 10200 speaks the Wyoming protocol (JSON lines over TCP), not HTTP,
  # so the healthcheck asks it to describe itself and expects "info" back.
  piper:
    image: rhasspy/wyoming-piper:2.4.2
    profiles: ["agents"]
    container_name: piper
    command:
      - --voice
      - ${PIPER_VOICE:-en_US-lessac-medium}
      - --length-scale
      - ${PIPER_LENGTH_SCALE:-1.0}
      - --noise-scale
      - ${PIPER_NOISE_SCALE:-0.667}
      - --noise-w-scale
      - ${PIPER_NOISE_W:-0.333}
    volumes:
      # The image downloads voices into its --data-dir, /data.
      - ./agent/data/piper:/data
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; s = socket.create_connection(('127.0.0.1', 10200), 5); s.sendall(b'{\"type\": \"describe\"}\\n'); assert b'\"info\"' in s.makefile('rb').readline()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - homepilot

networks:
  homepilot:
    driver: bridge

volumes:
  n8n-data: