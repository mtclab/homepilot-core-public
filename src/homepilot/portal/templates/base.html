<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}HomePilot{% endblock %}</title>
{% block head %}{% endblock %}
<style>
:root {
  --font-serif: "Source Serif 4", Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  --color-bg: #14100d;
  --color-surface: #1c1815;
  --color-border: #2f2823;
  --color-text: #ece5dd;
  --color-muted: #a2948a;
  --color-accent: #b98157;

  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.75rem;
  --space-6: 3rem;

  --radius-sm: 3px;
  --radius-md: 6px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-serif);
  font-size: 1.0625rem;
  line-height: 1.65;
}

.page {
  max-width: 40rem;
  margin: 0 auto;
  padding: var(--space-6) var(--space-4) var(--space-5);
}

h1 {
  font-family: var(--font-serif);
  font-size: 1.75rem;
  font-weight: 600;
  line-height: 1.25;
  margin: 0 0 var(--space-4);
}

h2 {
  font-family: var(--font-sans);
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: none;
  color: var(--color-muted);
  margin: var(--space-5) 0 var(--space-3);
}

p { margin: 0 0 var(--space-4); }
p.lede { color: var(--color-muted); }

a { color: var(--color-accent); }

.rule {
  height: 2px;
  width: 3rem;
  background: var(--color-accent);
  border: 0;
  margin: 0 0 var(--space-5);
}

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-5);
  margin: 0 0 var(--space-5);
}

dl.spec {
  font-family: var(--font-sans);
  font-size: 0.875rem;
  display: grid;
  grid-template-columns: 9rem 1fr;
  gap: var(--space-2) var(--space-4);
  margin: 0;
}
dl.spec dt { color: var(--color-muted); }
dl.spec dd { margin: 0; }

form { font-family: var(--font-sans); }

label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 600;
  margin: 0 0 var(--space-1);
}

.hint {
  font-family: var(--font-sans);
  font-size: 0.8125rem;
  color: var(--color-muted);
  margin: 0 0 var(--space-2);
}

.field { margin: 0 0 var(--space-5); }

input[type="text"], textarea {
  width: 100%;
  font-family: var(--font-sans);
  font-size: 0.9375rem;
  color: var(--color-text);
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-2) var(--space-3);
}

input[type="text"]:focus, textarea:focus {
  outline: 2px solid var(--color-accent);
  outline-offset: 1px;
}

textarea { min-height: 5.5rem; resize: vertical; }

button {
  font-family: var(--font-sans);
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--color-bg);
  background: var(--color-accent);
  border: 0;
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-5);
  cursor: pointer;
}

.status {
  font-family: var(--font-sans);
  font-size: 0.8125rem;
  font-weight: 600;
  display: inline-block;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
}
.status-running { color: #d9a441; border-color: #4a3a1d; }
.status-ok { color: #7fb069; border-color: #2f4327; }
.status-bad { color: #d2695e; border-color: #4a2723; }

.notice {
  font-family: var(--font-sans);
  font-size: 0.875rem;
  color: var(--color-muted);
  border-left: 2px solid var(--color-accent);
  padding-left: var(--space-4);
}

pre.connect {
  font-size: 0.8125rem;
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
  overflow-x: auto;
}

footer {
  font-family: var(--font-sans);
  font-size: 0.75rem;
  color: var(--color-muted);
  border-top: 1px solid var(--color-border);
  margin-top: var(--space-6);
  padding-top: var(--space-4);
}
</style>
</head>
<body>
<main class="page">
{% block content %}{% endblock %}
<footer>Built by MTC Lab</footer>
</main>
</body>
</html>
