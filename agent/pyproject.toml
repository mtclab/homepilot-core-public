[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hp-agent"
version = "2.3.0"
description = "HomePilot managed-host agent"
requires-python = ">=3.11"
license = "AGPL-3.0-only"

[project.scripts]
hp-agent = "hp_agent.main:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]