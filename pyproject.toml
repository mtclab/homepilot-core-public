[project]
name = "homepilot"
version = "3.6.23"
description = "AI-first, artifact-backed, MCP-native homelab platform"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
readme = "README.md"

dependencies = [
    # 0.137 stopped flattening include_router into the parent's route list and
    # keeps an _IncludedRouter wrapper instead, which briefly blinded the startup
    # route scope guard (#405) - it walked 5 routes instead of 81 and reported a
    # clean bill of health. #472 taught the guard to descend into the wrapper,
    # rebuild full paths from the accumulated include prefixes, and read the
    # dependencies attached at include time (where most of this API's scopes
    # live). The guard handles BOTH shapes, so no upper bound is needed; the
    # gates in tests/test_route_scope_guard.py hold the line.
    "fastapi>=0.115",
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "aiosqlite>=0.21",
    "sqlite-vec>=0.1.3,<1",
    "asyncssh>=2.17",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.0",
    "pyyaml>=6.0",
    # Bounded to the 2.x line: the code is migrated to the mcp 2.x server API
    # (on_list_tools/on_call_tool + streamable_http_app). Keep an upper bound so a
    # future 3.0 can't silently break a fresh build (see the build-reproducibility
    # lesson) — bump deliberately.
    "mcp>=2.0,<3",
    "cryptography>=50.0.0",
    "pyrage>=0.4",
    "jinja2>=3.1",
    "aiohttp>=3.14.0",
    "sse-starlette>=1.6",
    "prometheus-client>=0.21",
    # The estate's own Proxmox library (repo mtclab/proxmox-mcp, mirrored public
    # as proxmox-mcp-public). HomePilot does NOT re-implement PVE endpoints: SDN
    # zones/vnets/subnets, the apply, and the per-VM firewall all live there, and
    # a second copy of an endpoint path here is a second place to fix when PVE
    # changes one. HomePilot's own ProxmoxClient keeps what it already does
    # (clone, power, status) and gains no new endpoint knowledge.
    #
    # Sourced from the PUBLIC mirror rather than the private repo, because the
    # Docker image and the mirror CI both install without a credential. A PEP
    # 508 direct URL rather than a [tool.uv.sources] entry ON PURPOSE: sources
    # are applied only by `uv sync`, so plain `pip install -e .` (the mirror
    # CI) could not resolve the package at all - every installer understands
    # the URL form. Pinned by commit for reproducibility.
    "homepilot-proxmox-mcp @ git+https://github.com/mtclab/proxmox-mcp-public.git@386cfb2a0237c8491260a93f8324a0e52168e4a9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "faker>=37.0",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "respx>=0.22",
    "playwright>=1.40",
    "pytest-playwright>=0.5",
    "pytest-order>=1.2",
    "pytest-timeout>=2.3",
]

security = [
    "pip-audit>=0.1",
    "bandit>=1.9.4,<2",
    "detect-secrets>=1.5",
]

[project.scripts]
hp = "homepilot.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the PEP 508 git URL above; hatchling refuses direct references
# by default because on PyPI they would be unpublishable - this package is
# never published to PyPI (it ships as a Docker image), so the URL is fine.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/homepilot"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
per-file-ignores = { "tests/*" = ["E501"], "scripts/*" = ["E501"] }

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyrage"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp"
ignore_missing_imports = true

# The estate's own Proxmox library ships no py.typed marker yet. Scoped to the
# one adapter that imports it (adapters/pve_sdn.py) by naming the package, so
# nothing else in this codebase loses type checking - and it is a real upstream
# TODO rather than a permanent exemption.
[[tool.mypy.overrides]]
module = "proxmox_mcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Bound every test (and unblock an intermittent async-teardown hang); thread
# method so a stuck socket/subprocess can't wedge the whole run. See issue #295.
timeout = 120
timeout_method = "thread"
markers = [
    "e2e: end-to-end tests requiring a live HomePilot instance (HP_TEST_TOKEN must be set)",
    "integration: integration tests that exercise multiple components together",
]
[tool.bandit]
# HomePilot is an infrastructure-automation tool: running subprocesses (always
# with list args, never shell=True) and resolving 'git'/'ansible-playbook' off
# PATH are by-design, not findings. These categories are skipped project-wide;
# the residual reviewed false positives (field-name string literals, SQL built
# from code-controlled column lists with ?-bound values) stay in
# .bandit_baseline.json so a genuinely NEW finding still fails CI.
skips = ["B404", "B603", "B607"]
