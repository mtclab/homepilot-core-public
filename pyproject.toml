[project]
name = "homepilot"
version = "2.3.6"
description = "AI-first, artifact-backed, MCP-native homelab platform"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "starlette>=0.40",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "aiosqlite>=0.21",
    "sqlite-vec>=0.1.3,<1",
    "asyncssh>=2.17",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "cryptography>=44.0",
    "pyrage>=0.4",
    "jinja2>=3.1",
    "aiohttp>=3.9",
    "sse-starlette>=1.6",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "faker>=37.0",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "respx>=0.22",
    "playwright>=1.40",
    "pytest-timeout>=2.3",
]

security = [
    "pip-audit>=0.1",
    "bandit>=1.9.4,<2",
    "detect-secrets>=1.5",
]

[project.scripts]
hp = "homepilot.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homepilot"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
per-file-ignores = { "tests/*" = ["E501"], "scripts/*" = ["E501"] }

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyrage"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Bound every test (and unblock an intermittent async-teardown hang); thread
# method so a stuck socket/subprocess can't wedge the whole run. See issue #295.
timeout = 120
timeout_method = "thread"
markers = [
    "e2e: end-to-end tests requiring a live HomePilot instance (HP_TEST_TOKEN must be set)",
    "integration: integration tests that exercise multiple components together",
]